schema: themis-spec-projection
output: spec.md
marker: themis-projection
source_name: spec.yaml

sections:
  - id: review_summary
    heading: Review Summary
  - id: architecture
    heading: Architecture at a Glance
  - id: decisions
    heading: Key Decisions
  - id: contracts
    heading: Contracts and Invariants
  - id: acceptance
    heading: Acceptance Criteria
  - id: risks
    heading: Risks, Limitations, and Rollback
  - id: approval
    heading: Approval
  - id: appendix
    heading: Appendix

primary_view:
  max_decisions: 5
  max_risks: 5
  diagrams:
    low:
      min: 0
      max: 1
      require_reason_when_empty: true
    medium:
      min: 1
      max: 2
      require_reason_when_empty: false
    high:
      min: 1
      max: 2
      require_reason_when_empty: false
  acceptance_criteria: all
  renderer_summarizes: false

drift:
  source_oid: git_blob_oid
  body_oid: git_blob_oid
  canonical_line_endings: lf
  terminal_newline: true
  reverse_sync: forbidden
