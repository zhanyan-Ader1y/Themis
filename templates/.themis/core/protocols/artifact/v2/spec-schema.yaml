schema: themis-spec-schema
artifact_schema: themis-artifact/v2

identity:
  spec_id_pattern: '^[a-z0-9][a-z0-9._-]*$'
  object_id_pattern: '^[A-Z]{2,3}-[0-9]{3,}$'

top_level:
  required:
    - id
    - title
    - status
    - revision
    - created_at
    - updated_at
    - author
    - complexity
    - review
    - context_basis
    - intent
    - scope
    - evidence
    - assumptions
    - options
    - decisions
    - requirements
    - interfaces
    - contracts
    - invariants
    - acceptance_criteria
    - adversarial_findings
    - risks
    - diagrams
    - rollback
    - approval
  allowed:
    - id
    - title
    - status
    - revision
    - created_at
    - updated_at
    - author
    - complexity
    - review
    - context_basis
    - intent
    - scope
    - evidence
    - assumptions
    - options
    - decisions
    - requirements
    - interfaces
    - contracts
    - invariants
    - acceptance_criteria
    - adversarial_findings
    - risks
    - diagrams
    - rollback
    - approval

enums:
  status: [draft, specified]
  complexity_level: [pending, low, medium, high]
  context_disposition: [pending, grounded, not_required, limited]
  assumption_status: [pending, validated, invalid]
  option_disposition: [pending, selected, rejected, option_zero]
  requirement_kind: [functional, non_functional]
  evidence_kind: [context, code, external, user]
  interface_kind: [api, cli, event, file, schema, ui]
  adversarial_dimension:
    - boundary_conditions
    - concurrency_and_race
    - state_transitions
    - security_and_permissions
    - dependency_failures
    - data_integrity
  severity: [low, medium, high, critical]
  adversarial_disposition: [pending, cover, accept, defer]
  risk_status: [open, accepted, deferred, resolved]
  approval_decision: [pending, approved, rejected]

fixed_maps:
  complexity:
    required: [level, confirmed, rationale, override_reason]
    allowed: [level, confirmed, rationale, override_reason]
  review:
    required: [summary, primary_decisions, primary_risks, primary_diagrams, no_diagram_reason]
    allowed: [summary, primary_decisions, primary_risks, primary_diagrams, no_diagram_reason]
  review_summary:
    required: [request, intent, root_cause, included, excluded, success, blockers]
    allowed: [request, intent, root_cause, included, excluded, success, blockers]
  context_basis:
    required: [disposition, evidence_refs, limitation_refs, rationale]
    allowed: [disposition, evidence_refs, limitation_refs, rationale]
  intent:
    required: [request, outcome, root_cause]
    allowed: [request, outcome, root_cause]
  rollback:
    required: [triggers, steps, impact]
    allowed: [triggers, steps, impact]
  approval:
    required: [decision, approved_by, approved_at, record]
    allowed: [decision, approved_by, approved_at, record]

collections:
  scope:
    prefix: SCP-
    required: [kind, statement, rationale]
    allowed: [kind, statement, rationale]
    strings: [kind, statement, rationale]
    enums:
      kind: [include, exclude]
  evidence:
    prefix: EVD-
    required: [kind, source, summary]
    allowed: [kind, source, summary]
    strings: [kind, source, summary]
    enums:
      kind: [context, code, external, user]
  assumptions:
    prefix: ASM-
    required: [statement, validation, status]
    allowed: [statement, validation, status]
    strings: [statement, validation, status]
    enums:
      status: [pending, validated, invalid]
  options:
    prefix: OPT-
    required: [summary, tradeoffs, disposition]
    allowed: [summary, tradeoffs, disposition]
    strings: [summary, tradeoffs, disposition]
    enums:
      disposition: [pending, selected, rejected, option_zero]
  decisions:
    prefix: DEC-
    required: [summary, rationale, tradeoffs, option_refs]
    allowed: [summary, rationale, tradeoffs, option_refs]
    strings: [summary, rationale, tradeoffs]
    readiness_non_empty: [summary, rationale, tradeoffs]
    references:
      option_refs: options
  requirements:
    prefix: REQ-
    required: [kind, statement, scope_refs, evidence_refs]
    allowed: [kind, statement, scope_refs, evidence_refs]
    strings: [kind, statement]
    readiness_non_empty: [statement]
    enums:
      kind: [functional, non_functional]
    references:
      scope_refs: scope
      evidence_refs: evidence
  interfaces:
    prefix: IFC-
    required: [name, kind, description, contract_refs]
    allowed: [name, kind, description, contract_refs]
    strings: [name, kind, description]
    enums:
      kind: [api, cli, event, file, schema, ui]
    references:
      contract_refs: contracts
  contracts:
    prefix: CTR-
    required: [statement, applies_to, requirement_refs]
    allowed: [statement, applies_to, requirement_refs]
    strings: [statement]
    references:
      applies_to: interfaces
      requirement_refs: requirements
  invariants:
    prefix: INV-
    required: [statement, scope_refs, requirement_refs]
    allowed: [statement, scope_refs, requirement_refs]
    strings: [statement]
    references:
      scope_refs: scope
      requirement_refs: requirements
  acceptance_criteria:
    prefix: AC-
    required: [requirement_refs, given, when, then, verification]
    allowed: [requirement_refs, given, when, then, verification]
    strings: [given, when, then, verification]
    readiness_non_empty: [given, when, then, verification]
    references:
      requirement_refs: requirements
  adversarial_findings:
    prefix: ADV-
    required: [dimension, severity, scenario, ac_refs, disposition, resolution_refs, risk_refs]
    allowed: [dimension, severity, scenario, ac_refs, disposition, resolution_refs, risk_refs]
    strings: [dimension, severity, scenario, disposition]
    enums:
      dimension: [boundary_conditions, concurrency_and_race, state_transitions, security_and_permissions, dependency_failures, data_integrity]
      severity: [low, medium, high, critical]
      disposition: [pending, cover, accept, defer]
    references:
      ac_refs: acceptance_criteria
      resolution_refs: '*'
      risk_refs: risks
  risks:
    prefix: RSK-
    required: [severity, statement, mitigation, status, owner]
    allowed: [severity, statement, mitigation, status, owner]
    strings: [severity, statement, mitigation, status, owner]
    enums:
      severity: [low, medium, high, critical]
      status: [open, accepted, deferred, resolved]
  diagrams:
    prefix: DGM-
    required: [title, type, purpose, content]
    allowed: [title, type, purpose, content]
    strings: [title, type, purpose, content]
    enums:
      type: [mermaid]

readiness_checks:
  - spec_intent_complete
  - spec_scope_complexity_confirmed
  - spec_context_complete
  - spec_design_acceptance_complete
  - spec_adversarial_resolved
  - spec_self_check_passed
  - spec_user_approval_recorded
  - spec_projection_current
