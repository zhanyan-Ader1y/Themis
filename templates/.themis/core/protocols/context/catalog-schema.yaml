schema: themis-context-catalog-schema
catalog_schema: themis-context-catalog
identity:
  context_id_pattern: '^CTX-[0-9]{3,}$'
  digest_pattern: '^sha256:[0-9a-f]{64}$'
top_level:
  required:
    - catalog_schema
    - binding
    - project
    - workspace_identity_digest
    - revision
    - catalog_digest
    - items
  allowed:
    - catalog_schema
    - binding
    - project
    - workspace_identity_digest
    - revision
    - catalog_digest
    - items
enums:
  binding: [unbound, bound]
  category: [domain, glossary, decisions, architecture, engineering, pitfalls, external]
  status: [active, deprecated, superseded, archived]
project:
  required: [name, root]
  allowed: [name, root]
revision:
  required: [kind, commit, worktree]
  allowed: [kind, commit, worktree]
item:
  required: [path, title, category, kind, authority, status, scope, tags, abstract, overview, source_refs, dependencies, supersedes, content_digest, item_digest]
  allowed: [path, title, category, kind, authority, status, scope, tags, abstract, overview, source_refs, dependencies, supersedes, content_digest, item_digest]
source_ref:
  required: [path, digest]
  allowed: [path, digest]
  path: project-relative-file
  digest: sha256
constraints:
  unique_ids: true
  unique_paths: true
  references_must_exist: true
  dependency_cycles_forbidden: true
  catalog_digest_excludes: [catalog_digest, revision]
