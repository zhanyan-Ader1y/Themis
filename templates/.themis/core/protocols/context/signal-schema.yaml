schema: themis-context-signal-schema
signal_schema: themis-context-signal
identity:
  signal_id_pattern: '^CSG-[0-9a-f]{64}$'
  context_id_pattern: '^CTX-[0-9]{3,}$'
  digest_pattern: '^sha256:[0-9a-f]{64}$'
top_level:
  required:
    - signal_schema
    - id
    - kind
    - status
    - project
    - workspace_identity_digest
    - revision
    - scope
    - sources
    - evidence_refs
    - first_observed_at
    - last_observed_at
    - disposition
  allowed:
    - signal_schema
    - id
    - kind
    - status
    - project
    - workspace_identity_digest
    - revision
    - scope
    - sources
    - evidence_refs
    - first_observed_at
    - last_observed_at
    - disposition
enums:
  kind: [missing, stale, context_conflict, context_code_drift]
  status: [open, resolved, accepted, superseded]
revision:
  required: [kind, commit, worktree]
  allowed: [kind, commit, worktree]
disposition:
  required: [actor, note, decided_at]
  allowed: [actor, note, decided_at]
constraints:
  open_disposition_is_null: true
  adjudicated_disposition_is_complete: true
