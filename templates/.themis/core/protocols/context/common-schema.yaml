schema: themis-context-common-schema
result_schema: themis-context-result
identity:
  context_id_pattern: '^CTX-[0-9]{3,}$'
  bundle_id_pattern: '^CBL-[0-9a-f]{64}$'
  signal_id_pattern: '^CSG-[0-9a-f]{64}$'
  digest_pattern: '^sha256:[0-9a-f]{64}$'
  transaction_id_pattern: '^CTXTX-[0-9a-f]{64}$'
enums:
  category: [domain, glossary, decisions, architecture, engineering, pitfalls, external]
  authority: [declared, governed, external_reference, derived_fact, derived_navigation]
  item_status: [active, deprecated, superseded, archived]
  bundle_status: [complete, partial, conflict, unavailable]
  signal_kind: [missing, stale, context_conflict, context_code_drift]
  signal_status: [open, resolved, accepted, superseded]
  result_status: [ok, invalid, needs_adjudication, unavailable]
  revision_kind: [git, unavailable]
  worktree_status: [clean, dirty, unknown]
result:
  required: [schema, command, status, workspace, data, warnings, errors]
  allowed: [schema, command, status, workspace, data, warnings, errors]
revision:
  required: [kind, commit, worktree]
  allowed: [kind, commit, worktree]
digest:
  algorithm: sha256
  prefix: 'sha256:'
  yaml_canonicalization: recursive-key-sort-compact-json-lf
  markdown_body_canonicalization: utf8-no-bom-lf-single-final-newline
  file_canonicalization: raw-bytes
timestamp:
  format: utc-rfc3339-seconds
path:
  separator: '/'
  relative_only: true
  reject_segments: ['', '.', '..']
  reject_backslash: true
  reject_symlink_ancestors: true
