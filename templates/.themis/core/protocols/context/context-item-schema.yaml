schema: themis-context-item-schema
context_item_schema: themis-context-item
format: markdown-with-yaml-frontmatter
identity:
  id_pattern: '^CTX-[0-9]{3,}$'
  digest_pattern: '^sha256:[0-9a-f]{64}$'
frontmatter:
  required:
    - context_item_schema
    - id
    - title
    - category
    - kind
    - authority
    - status
    - scope
    - tags
    - abstract
    - overview
    - source_refs
    - dependencies
    - supersedes
    - content_digest
  allowed:
    - context_item_schema
    - id
    - title
    - category
    - kind
    - authority
    - status
    - scope
    - tags
    - abstract
    - overview
    - source_refs
    - dependencies
    - supersedes
    - content_digest
enums:
  category: [domain, glossary, decisions, architecture, engineering, pitfalls, external]
  authority: [declared, governed, external_reference, derived_fact, derived_navigation]
  status: [active, deprecated, superseded, archived]
sequences: [scope, tags, source_refs, dependencies, supersedes]
source_ref:
  required: [path, digest]
  allowed: [path, digest]
  path: project-relative-file
  digest: sha256
strings: [context_item_schema, id, title, category, kind, authority, status, abstract, overview, content_digest]
references:
  dependencies: context_item
  supersedes: context_item
body:
  required: true
  digest_field: content_digest
