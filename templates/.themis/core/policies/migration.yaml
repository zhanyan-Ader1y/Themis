# Themis 显式迁移策略配置
# 由 P4.5 Explicit Migration 安装。

migration:
  # 备份配置
  backup:
    enabled: true
    path_pattern: ".themis-migration-backup"
    retention: keep
    verify_before_proceed: true

  # 安全约束
  safety:
    atomic: true
    require_user_confirmation: true
    allow_partial: false
    rollback_on_any_failure: true
    idempotency_check: true

  # 迁移脚本调用约定
  script_convention:
    input_arg: "workspace_path"
    output_format: "json"
    output_schema:
      status: ["success", "failure", "skipped"]
      changed_files: ["list"]
      errors: ["list"]
    exit_codes:
      0: "success"
      1: "failure"
      2: "skipped (already applied)"

  # 验证步骤
  verification:
    steps:
      - id: "directory_integrity"
        description: "检查 Workspace 目录结构完整性"
        type: script
      - id: "artifact_format"
        description: "检查工件格式正确性（yq 语法检查）"
        type: script
      - id: "index_consistency"
        description: "检查 context-map 引用有效性"
        type: script
      - id: "manifest_version"
        description: "确认 manifest.yaml 中 workspace_schema/artifact_schema 已更新"
        type: script
    fail_action: rollback

  # 迁移日志
  log:
    path: "workspace/state/migration_log/"
    format: "json"
    fields:
      - timestamp
      - migration_id
      - script_path
      - status
      - changed_files
      - errors
      - backup_path
