# Themis 需求追问策略配置
# 该策略声明 Draft 阶段的语义门禁；字段类型、对象 ID 和引用由唯一 Spec 合同定义。

specification:
  schema: themis-specification-policy

  artifact:
    authoritative_source: spec.yaml
    human_projection: spec.md
    reverse_sync: forbidden

  publishing:
    executor: core/kernel/specification/themis-spec.sh
    candidate_root: workspace/cache/spec-candidates
    publisher_only: true
    fail_closed: true
    require_pair_validation: true
    restore_previous_pair_on_failure: true
    preserve_complete_backup_on_restore_failure: true
    report_recovery_path_on_restore_failure: true

  projection:
    renderer_summarizes: false
    primary_view:
      max_decisions: 5
      max_risks: 5
      diagrams:
        low: {min: 0, max: 1, require_reason_when_empty: true}
        medium: {min: 1, max: 2, require_reason_when_empty: false}
        high: {min: 1, max: 2, require_reason_when_empty: false}
      acceptance_criteria: all

  readiness:
    draft_validity:
      - spec_structure_valid
      - spec_ids_valid
      - spec_references_valid
    specified:
      - spec_intent_complete
      - spec_scope_complexity_confirmed
      - spec_context_complete
      - spec_design_acceptance_complete
      - spec_adversarial_resolved
      - spec_self_check_passed
      - spec_user_approval_recorded
      - spec_projection_current

  questioning:
    complexity:
      precedence: [low, medium, high]
      low:
        max_files_touched: 1
        max_new_apis: 0
        allows_state_change: false
        requires_unambiguous_scope: true
      medium:
        max_files_touched: 8
        max_new_apis: 3
        allows_state_change: true
      high:
        fallback: true
        forced_triggers:
          - multi_subsystem
          - architecture_change
          - security_sensitive
          - performance_sensitive
      require_user_confirmation: true

    flow:
      low:
        step_0: minimal
        step_1: full
        step_2: skip
        step_3: minimal
        step_4: quick
      medium:
        step_0: full
        step_1: full
        step_2: full
        step_3: full
        step_4: focused
      high:
        step_0: full
        step_1: full
        step_2: full
        step_3: full
        step_4: comprehensive

    ac_segmentation:
      max_acs_per_segment: 3
      require_explicit_approval: true

    option_zero:
      enabled: true
      skip_conditions: []

  adversarial_validation:
    enabled: true
    dimensions:
      - boundary_conditions
      - concurrency_and_race
      - state_transitions
      - security_and_permissions
      - dependency_failures
      - data_integrity
    quick_checklist:
      - empty_input
      - failure_state
      - concurrency
      - backward_compatibility
      - rollback
    max_iterations:
      quick: 3
      focused: 5
      comprehensive: 10
    dispositions: [cover, accept, defer]
    unresolved_finding_action: remain_draft
    deferral:
      enabled: true
      max_per_spec: 5
      blocked_dimensions_when_critical:
        - security_and_permissions
        - data_integrity

  red_flags:
    - too_simple
    - skip_spec
    - code_first
    - already_clear
    - try_one_line
    - obviously_best

  semantic_consistency:
    placeholder_patterns:
      - '(?i)(^|[^a-z])todo([^a-z]|$)'
      - '(?i)(^|[^a-z])tbd([^a-z]|$)'
      - '(?i)(^|[^a-z])placeholder([^a-z]|$)'
      - '\?\?\?'
    require_summary_intent_match: true
    require_scope_summary_match: true
    require_resolved_assumptions_and_options: true
    require_selected_option_references: true
    require_requirement_and_ac_traceability: true
    require_complete_rollback: true
