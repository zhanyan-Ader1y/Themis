# Themis 需求追问策略配置
# 该策略声明 Draft 阶段的结构化门禁；语义判断与用户确认由 Prompt 驱动。

specification:
  schema: themis-specification-policy/v1

  questioning:
    # ---------------------------------------------------------------------------
    # 复杂度分类规则（确定性判定顺序，Prompt 不得自行实现）：
    #
    # 1. 若请求满足 low 的全部条件 ——
    #      max_files_touched ≤ 1
    #      max_new_apis = 0
    #      allows_state_change = false
    #      requires_unambiguous_scope 通过
    #    且不命中 forced_triggers
    #    → low
    #
    # 2. 否则若请求在 medium 上限内 ——
    #      max_files_touched ≤ 8
    #      max_new_apis ≤ 3
    #    且不命中 forced_triggers
    #    → medium
    #
    # 3. 否则 → high
    #
    # forced_triggers（任意命中强制 high）：
    #   multi_subsystem · architecture_change · security_sensitive · performance_sensitive
    #
    # require_user_confirmation = true 表示用户必须显式确认最终分类；
    # 用户可覆盖，但覆盖原因必须写入 Draft Spec。
    # ---------------------------------------------------------------------------
    complexity:
      precedence: [low, medium, high]
      low:
        max_files_touched: 1
        max_new_apis: 0
        allows_state_change: false
        requires_unambiguous_scope: true
      medium:
        max_files_touched: 8
        max_new_apis: 3
        allows_state_change: true
      high:
        fallback: true
        forced_triggers:
          - multi_subsystem
          - architecture_change
          - security_sensitive
          - performance_sensitive
      require_user_confirmation: true

    flow:
      low:
        step_0: minimal
        step_1: full
        step_2: skip
        step_3: minimal
        step_4: quick
      medium:
        step_0: full
        step_1: full
        step_2: full
        step_3: full
        step_4: focused
      high:
        step_0: full
        step_1: full
        step_2: full
        step_3: full
        step_4: comprehensive

    ac_segmentation:
      max_acs_per_segment: 3
      require_explicit_approval: true

    option_zero:
      enabled: true
      skip_conditions: []

  adversarial_validation:
    enabled: true
    dimensions:
      - boundary_conditions
      - concurrency_and_race
      - state_transitions
      - security_and_permissions
      - dependency_failures
      - data_integrity
    quick_checklist:
      - empty_input
      - failure_state
      - concurrency
      - backward_compatibility
      - rollback
    max_iterations:
      quick: 3
      focused: 5
      comprehensive: 10
    dispositions: [cover, accept, defer]
    unresolved_finding_action: remain_draft
    deferral:
      enabled: true
      max_per_spec: 5
      blocked_dimensions_when_critical:
        - security_and_permissions
        - data_integrity

  red_flags:
    - too_simple
    - skip_spec
    - code_first
    - already_clear
    - try_one_line
    - obviously_best

  self_check:
    structural:
      - no_placeholders
      - no_contradictions
      - no_ambiguous_terms
      - scope_explicit
    adversarial:
      - assumptions_traceable
      - failure_scenarios_covered
      - evidence_anchored
      - attack_residue_recorded
      - root_cause_aligned
      - rollback_feasible
