# Lifecycle transition declaration
# Current checkout has no transition evaluator or state recorder.

lifecycle:
  order: [draft, specified, planned, reviewed, implemented, verified, archived]
  delivery_gates_after_verified: [human_acceptance, summary]

transitions:
  draft_to_specified:
    from: draft
    to: specified
    hard_gate: true
    conditions:
      - spec_intent_complete
      - spec_scope_complexity_confirmed
      - spec_context_complete
      - spec_design_acceptance_complete
      - spec_adversarial_resolved
      - spec_self_check_passed
      - spec_user_approval_recorded
      - spec_projection_current

assurance:
  evaluator: unavailable
  state_recorder: unavailable
  transition_claim_without_runtime: forbidden
