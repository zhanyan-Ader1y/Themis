# Prompt-level dual-scope control policy.
# This file is semantic input for the Global Control Rule.
# Current checkout has no strict validator, evaluator, recorder, digest service,
# invocation host, or deterministic write runtime.

contract: themis-core-control

policy_binding:
  identity: themis-core-control
  route_key: "capability + selected_path + profile + status"
  invocation_must_bind_observed_digest: true
  changed_digest_action: stop-and-revalidate
  fixed_route_count_is_product_identity: false

authority_model:
  external_input: immutable-source-event-bytes
  target_semantics: user-confirmed-source-bound-current-request-claims
  implementation_facts: [code, configuration, schema, observed-executable-behavior]
  governed_design_constraints: constrain-solutions-only
  specification_handoff: temporary-non-authoritative
  execution_contract: current-approved-plan
  capability_result: proposed-output-only
  authority_requires: [policy-control, complete-persistence, completion-observation, reread, current-pointer-update]

authority_scopes:
  request-intake:
    owns:
      - source-event-references
      - claim-and-assignment-proposals
      - user-confirmation-decisions
      - intake-execution-identity
      - intake-local-continuation
      - intake-current-pointers
      - intake-disposition
      - intake-retention-facts
    dispositions: [open, assigned, rejected, abandoned]
    retention_modes: [active, dormant-read-only]
    dormant-read-only-is-disposition: false
    selected_path: null
    profile: null
    lifecycle_creation_before_confirmed_assignment: forbidden
  lifecycle:
    owns:
      - current-request-revisions
      - questioning-rounds
      - path-and-plan-state
      - review-and-approval-state
      - plan-task-execution-identities
      - verification-acceptance-summary-state
      - lifecycle-local-continuations
      - lifecycle-current-pointers
    stages:
      - questioning
      - complexity-assessment
      - plan-formation
      - plan-check
      - review
      - verify
      - human-acceptance
      - summary
      - completed
  isolation:
    shared_dynamic_state: forbidden
    shared_execution_identity: forbidden
    shared_failure_budget: forbidden
    shared_continuation_authority: forbidden
    shared_current_pointer: forbidden
    shared_completion_state: forbidden
    allowed_cross_scope_data: stable-immutable-references-only

external_message_interception:
  required_before_lifecycle_semantics: true
  first_action: record-immutable-source-event
  attachment_decision_sources:
    confirmation-continuation: active-durable-intake-local-record
    restart-unblock-continuation: active-durable-intake-local-record
    otherwise: create-new-intake
  forbidden_attachment_signals: [wording, adjacency, open-intake-existence, dormant-read-only-intake, chat-history, agent-summary]
  lifecycle_continuation_after_intake:
    requires: materialized-assignment-decision
    no-change: resume-original-durable-dialogue-continuation
    changed-assignment: follow-decision-bound-continuations
  target_operations: [create-lifecycle, update-current-request, no-change]
  multi_target_materialization:
    assignment-decision: immutable
    execute-observe-and-record: per-target
    assigned_requires: all-targets-completed
    partial_result: open-plus-incomplete
    completed_target_rollback: forbidden
    recovery_action: reread-target-status-and-resume-remaining-target-operations-only
  host_observed_abandonment:
    signal: explicit-host-session-termination-or-leave-event
    control_action: record-intake-abandoned
    capability_status: none
    inferred-from-silence: forbidden

lifecycle_completion_retention:
  trigger:
    source_control_action: materialize-summary-pair-and-complete-lifecycle
    requires: [summary-pair-fully-materialized-and-reread, lifecycle-completion-observed]
  applicable_targets: all-assigned-intake-targets-bound-to-completed-lifecycle-identity
  per_completed_target:
    action: record-completion-observation-and-freeze-target-binding-read-only
    changes-intake-disposition: false
    changes-other-targets: false
  whole_intake_gate: all-associated-lifecycle-targets-observed-completed
  while-gate-unsatisfied:
    retention_mode: active
    unfinished-targets-remain-operable: true
  when-gate-satisfied:
    intake-disposition: preserve-assigned
    retention_mode: dormant-read-only
    deactivate-all-intake-continuations: true
    future-message-attachment: forbidden-create-new-intake
    new-invocation: forbidden
    recovery-or-reactivation: forbidden
    mutation: forbidden
  retain-read-only:
    - source-events
    - claim-and-assignment-proposals
    - confirmation-decisions
    - assignment-decisions
    - target-materialization-observations
    - lifecycle-completion-observations
    - historical-bindings-and-continuations
  delete: none
  rebuildable-cache-cleanup: allowed
  route-key-dimension: false
  capability-status: none
  cross-scope-transfer: stable-immutable-references-only

vocabulary:
  agent_profiles: [semantic-readonly, independent-checker, human-dialogue, implementation-writer]
  authority_scopes: [request-intake, lifecycle]
  selected_paths: [simple, full, null]
  profiles: [lightweight, full, null]
  failure_classes: [none, non-counted, counted]
  lifecycle_affected_owners:
    - current-request-dialogue
    - questioning
    - specification
    - simple-planning
    - planning
    - plan-check
    - review-projection
  route_targets:
    - human-request-confirmation
    - intake-closed
    - decision-bound-continuation
    - human-questioning
    - human-review
    - human-acceptance
    - human-unblock
    - requesting-capability
    - resume-scope-main-route
    - failure-control
    - themis-current-request-dialogue
    - themis-q
    - themis-grounding
    - themis-complexity-assessment
    - themis-simple-plan
    - themis-spec
    - themis-planning
    - themis-plan-check
    - themis-review-projection
    - themis-review-check
    - themis-review-dialogue
    - themis-impl
    - themis-verification
    - themis-acceptance-dialogue
    - themis-failure-learning
    - themis-summary
    - completed
  invalidation_categories:
    - intake-proposal
    - intake-decision
    - current-request
    - questioning
    - complexity-assessment
    - quick-plan
    - plan
    - plan-check
    - review-projection
    - review-check
    - review-feedback
    - review-approval
    - unfinished-downstream
    - affected-verification-evidence
    - human-acceptance
    - summary

capabilities:
  themis-current-request-dialogue:
    authority_scopes: [request-intake]
    agent_profile: human-dialogue
    selected_path_profile_domain: [[null, null]]
    legal_statuses: [needs-request-confirmation, assignment-confirmed, rejected]
    materialization_targets: [request-intake-proposal, request-intake-decision]
  themis-q:
    authority_scopes: [lifecycle]
    agent_profile: human-dialogue
    selected_path_profile_domain: [[null, null]]
    legal_statuses: [needs-questioning, converged]
    materialization_targets: [questioning-proposal, questioning-round-pair]
  themis-grounding:
    authority_scopes: [lifecycle]
    agent_profile: semantic-readonly
    selected_path_profile_domain: [[null, null]]
    legal_statuses: [ready, partial, blocked]
    materialization_targets: [grounding-structured-record]
  themis-complexity-assessment:
    authority_scopes: [lifecycle]
    agent_profile: semantic-readonly
    selected_path_profile_domain: [[null, null]]
    legal_statuses: [simple-qualified, full-required, blocked]
    materialization_targets: [complexity-assessment-structured-record]
  themis-simple-plan:
    authority_scopes: [lifecycle]
    agent_profile: semantic-readonly
    selected_path_profile_domain: [[simple, lightweight]]
    legal_statuses: [ready, escalate-full, blocked]
    materialization_targets: [plan-pair]
  themis-spec:
    authority_scopes: [lifecycle]
    agent_profile: semantic-readonly
    selected_path_profile_domain: [[full, null]]
    legal_statuses: [ready, needs-questioning, needs-grounding, blocked]
    materialization_targets: [temporary-specification-handoff]
  themis-planning:
    authority_scopes: [lifecycle]
    agent_profile: semantic-readonly
    selected_path_profile_domain: [[full, full]]
    legal_statuses: [ready, needs-specification, needs-grounding, blocked]
    materialization_targets: [plan-pair]
  themis-plan-check:
    authority_scopes: [lifecycle]
    agent_profile: independent-checker
    selected_path_profile_domain: [[simple, lightweight], [full, full]]
    legal_statuses:
      simple/lightweight: [pass, needs-simple-planning, escalate-full, blocked]
      full/full: [pass, needs-planning, needs-specification, needs-grounding, blocked]
    materialization_targets: [plan-check-structured-record]
  themis-review-projection:
    authority_scopes: [lifecycle]
    agent_profile: semantic-readonly
    selected_path_profile_domain: [[simple, lightweight], [full, full]]
    legal_statuses: [ready, blocked]
    materialization_targets: [review-projection-pair]
  themis-review-check:
    authority_scopes: [lifecycle]
    agent_profile: independent-checker
    selected_path_profile_domain: [[simple, lightweight], [full, full]]
    legal_statuses: [pass, needs-projection]
    materialization_targets: [review-check-structured-record]
  themis-review-dialogue:
    authority_scopes: [lifecycle]
    agent_profile: human-dialogue
    selected_path_profile_domain: [[simple, lightweight], [full, full]]
    legal_statuses:
      simple/lightweight: [continue, approved, needs-current-request, needs-questioning, needs-simple-planning, needs-planning, needs-specification, needs-grounding, escalate-full]
      full/full: [continue, approved, needs-current-request, needs-questioning, needs-planning, needs-specification, needs-grounding]
    materialization_targets: [review-dialogue-continuation, review-feedback-pair, review-approval-pair]
  themis-impl:
    authority_scopes: [lifecycle]
    agent_profile: implementation-writer
    selected_path_profile_domain: [[simple, lightweight], [full, full]]
    legal_statuses:
      simple/lightweight: [implemented, needs-planning, escalate-full, blocked]
      full/full: [implemented, needs-planning, blocked]
    materialization_targets: [implementation-delta-and-impl-result-pair]
  themis-verification:
    authority_scopes: [lifecycle]
    agent_profile: independent-checker
    selected_path_profile_domain: [[simple, lightweight], [full, full]]
    legal_statuses:
      simple/lightweight: [passed, failed, needs-planning, needs-specification, escalate-full, blocked]
      full/full: [passed, failed, needs-planning, needs-specification, blocked]
    materialization_targets: [verification-pair-and-evidence]
  themis-acceptance-dialogue:
    authority_scopes: [lifecycle]
    agent_profile: human-dialogue
    selected_path_profile_domain: [[simple, lightweight], [full, full]]
    legal_statuses:
      simple/lightweight: [accepted, implementation-defect, needs-planning, needs-specification, escalate-full]
      full/full: [accepted, implementation-defect, needs-planning, needs-specification]
    materialization_targets: [human-acceptance-pair]
  themis-failure-learning:
    authority_scopes: [request-intake, lifecycle]
    agent_profile: semantic-readonly
    selected_path_profile_domain: [[null, null], [simple, lightweight], [full, full]]
    legal_statuses: [candidate-ready, not-reusable, needs-more-evidence, blocked]
    materialization_targets: [failure-learning-pair]
  themis-summary:
    authority_scopes: [lifecycle]
    agent_profile: semantic-readonly
    selected_path_profile_domain: [[simple, lightweight], [full, full]]
    legal_statuses: [ready, blocked]
    materialization_targets: [summary-pair]

materialization:
  capability_result_is_authority: false
  ordered_steps:
    - validate-proposed-result-identity-scope-profile-status-and-bindings
    - match-exactly-one-policy-route
    - execute-declared-control-action
    - persist-every-required-component
    - record-completion-or-incomplete-observation
    - reread-record-content-identity-digest-and-bindings
    - create-immutable-revision-observation
    - update-separate-current-pointer
  pair_requirements:
    indivisible_components: [machine-record, markdown-content]
    invalid_when: [component-missing, identity-mismatch, digest-mismatch, authority-scope-mismatch, binding-mismatch]
  structured_requirements:
    immutable-record: true
    typed-bindings: required
    observation: required
  temporary_handoff_exception:
    target: temporary-specification-handoff
    semantic_authority: false
    persistent-current-pointer: forbidden
    recovery: regenerate-from-current-bindings
  incomplete_action: remain-at-last-proven-gate
  pointer_update_failure:
    revision_may-remain-valid: true
    revision_becomes-current: false
  stale_duplicate_late_or_wrong-scope-result: reject-and-count-failure
  file-existence-implies-success: false

currentness:
  require:
    - observed-policy-binding
    - current-source-and-artifact-bindings
    - matching-authority-scope
    - matching-execution-and-invocation-identities
    - matching-agent-profile
    - matching-selected-path-and-profile
    - observed-recorder-result
    - reread-identity-content-digest-and-bindings
  policy-change: stop-and-revalidate
  source-or-artifact-change: invalidate-dependents
  external-drift: non-counted-stop-and-revalidate

recovery:
  authoritative_inputs:
    - scope-state
    - current-pointers
    - completion-and-incomplete-markers
    - artifact-components
    - invocation-and-attempt-records
    - applicable-git-facts
  result: last-proven-gate
  forbidden_sources: [chat, agent-summary, temporary-reasoning, temporary-specification-handoff]
  automatic_repair: forbidden
  automatic_rollback: forbidden
  automatic_merge: forbidden
  inferred_completion: forbidden

failure_control:
  request-intake:
    identity: intake-execution-identity
    maximum_counted_failures: 3
    third_failure: [record-termination, forbid-fourth-invocation, preserve-intake-open, require-explicit-restart-unblock-continuation]
  lifecycle:
    identity: plan-task-execution-identity
    maximum_counted_failures: 3
    shared_by: [themis-impl, themis-verification, acceptance-implementation-defect-repair]
    third_failure: [record-termination, forbid-fourth-invocation, invalidate-unfinished-task-downstream]
  counted:
    - started-invocation-agent-failure
    - started-tool-or-command-failure
    - missing-invalid-wrong-profile-wrong-scope-or-stale-result
    - result-contract-failure
    - declared-execution-failure
    - recorder-or-materialization-failure
    - implementation-defect
  not_counted:
    - waiting-for-user-confirmation
    - waiting-for-question-answer
    - waiting-for-human-review
    - waiting-for-human-acceptance
    - needs-request-confirmation
    - needs-questioning
    - needs-simple-planning
    - needs-planning
    - needs-specification
    - needs-grounding
    - blocked
    - partial
    - full-required
    - escalate-full
    - external-drift-stop-and-revalidate
  ordered_counted_failure_actions:
    - record-attempt-and-observed-failure
    - dispatch-scope-bound-non-blocking-failure-learning
    - terminate-on-third-or-preserve-exact-continuation
  identity_survives: [agent-restart, model-change, tool-retry, session-resume, simple-to-full-escalation]
  failure_learning:
    after_each_counted_failure: required
    after_explicitly-linked-later-success: required
    scope_bound: true
    non_blocking: true
    self_failure_recurses: false
    prose_similarity-establishes-link: false

lifecycle_control:
  paths:
    simple: [themis-q, themis-complexity-assessment, themis-simple-plan, themis-plan-check]
    full: [themis-q, themis-complexity-assessment, themis-spec, themis-planning, themis-plan-check]
  shared_after_plan_check:
    - themis-review-projection
    - themis-review-check
    - themis-review-dialogue
    - review-approval-materialization
    - themis-impl
    - themis-verification
    - themis-acceptance-dialogue
    - themis-summary
  full_path_required:
    sticky_within-lifecycle: true
    initial: false
    allowed_transition: false-to-true-only
    preserved_by: [questioning-reentry, reassessment, agent-restart, session-resume, task-retry]
    simple-route-guard: "full_path_required == false"
    simple-qualified-when-true:
      control_action: materialize-assessment-preserve-sticky-full-and-select-full
      next: themis-spec
      invalidation: [quick-plan, plan-check, review-projection, review-check, review-feedback, review-approval, unfinished-downstream]
      failure_class: non-counted
    clears-failure-budget: false
  review_gate:
    before-impl: true
    approval_requires-empty-unresolved-feedback: true
    approval_binds:
      - lifecycle-identity
      - confirmed-intake-assignment-decision
      - current-request-revision-and-active-claims
      - current-questioning-round
      - governed-design-constraints
      - grounding-and-complexity-assessment
      - selected-path-profile-and-full-path-required
      - checked-plan-revision-and-plan-check
      - shown-review-projection-and-review-check
      - approval-decision-source-event
      - approval-time
      - pre-impl-implementation-baseline
  verify:
    order: [themis-impl, themis-verification]
    separate-invocations: true
    shared-plan-task-execution-identity: true
    writer-self-verification: forbidden
    review-markdown-is-execution-input: false
    expected-approved-delta-invalidates-approval: false
  acceptance_gate:
    requires-current-verification: passed
  summary_gate:
    requires-current-verification: passed
    requires-current-human-acceptance: accepted
    knowledge-candidate-failure-blocks-completion: false

invalidation:
  intake-proposal-change: [intake-decision]
  confirmed-assignment-change: [current-request, questioning, complexity-assessment, plan, unfinished-downstream]
  current-request-revision-change: [questioning, complexity-assessment, plan, unfinished-downstream]
  questioning-round-change: [complexity-assessment, plan, unfinished-downstream]
  governed-design-constraint-change: [complexity-assessment, plan, unfinished-downstream]
  pre-approval-baseline-drift: [complexity-assessment, plan, unfinished-downstream]
  plan-change: [plan-check, review-projection, review-check, review-feedback, review-approval, unfinished-downstream]
  review-projection-change: [review-check, review-approval, unfinished-downstream]
  unresolved-review-feedback: [review-approval, unfinished-downstream]
  approval-invalid: [verify, human-acceptance, summary]
  implementation-change: [affected-verification-evidence, human-acceptance, summary]
  verification-not-passed: [human-acceptance, summary]
  sticky-full-escalation: [quick-plan, plan-check, review-projection, review-check, review-feedback, review-approval, unfinished-downstream]

routes:
  # Request Intake
  - {capability: themis-current-request-dialogue, selected_path: null, profile: null, status: needs-request-confirmation, next: human-request-confirmation, control_action: persist-intake-proposal-and-await-confirmation, invalidate: [], failure_class: non-counted}
  - {capability: themis-current-request-dialogue, selected_path: null, profile: null, status: assignment-confirmed, next: decision-bound-continuation, control_action: materialize-confirmed-assignment, invalidate: [intake-decision], failure_class: none}
  - {capability: themis-current-request-dialogue, selected_path: null, profile: null, status: rejected, next: intake-closed, control_action: persist-intake-rejection, invalidate: [], failure_class: none}

  # Questioning, grounding, and path selection
  - {capability: themis-q, selected_path: null, profile: null, status: needs-questioning, next: human-questioning, control_action: persist-question-proposal-and-await-answer, invalidate: [], failure_class: non-counted}
  - {capability: themis-q, selected_path: null, profile: null, status: converged, next: themis-complexity-assessment, control_action: materialize-questioning-round-and-pointer, invalidate: [complexity-assessment, plan, unfinished-downstream], failure_class: none}
  - {capability: themis-grounding, selected_path: null, profile: null, status: ready, next: requesting-capability, control_action: materialize-grounding-and-resume-continuation, invalidate: [], failure_class: none}
  - {capability: themis-grounding, selected_path: null, profile: null, status: partial, next: requesting-capability, control_action: materialize-partial-grounding-and-resume-continuation, invalidate: [], failure_class: non-counted}
  - {capability: themis-grounding, selected_path: null, profile: null, status: blocked, next: human-unblock, control_action: preserve-continuation-and-request-unblock, invalidate: [], failure_class: non-counted}
  - {capability: themis-complexity-assessment, selected_path: null, profile: null, status: simple-qualified, next: themis-simple-plan, control_action: materialize-assessment-and-select-simple, guard: full-path-not-required, guard_failure_action: materialize-assessment-preserve-sticky-full-and-select-full, guard_failure_next: themis-spec, invalidate: [], failure_class: none}
  - {capability: themis-complexity-assessment, selected_path: null, profile: null, status: full-required, next: themis-spec, control_action: materialize-assessment-and-set-sticky-full, invalidate: [quick-plan, plan-check, review-projection, review-check, review-feedback, review-approval, unfinished-downstream], failure_class: non-counted}
  - {capability: themis-complexity-assessment, selected_path: null, profile: null, status: blocked, next: human-unblock, control_action: preserve-continuation-and-request-unblock, invalidate: [], failure_class: non-counted}

  # Plan formation
  - {capability: themis-simple-plan, selected_path: simple, profile: lightweight, status: ready, next: themis-plan-check, control_action: materialize-unified-plan-pair, invalidate: [plan-check, review-projection, review-check, review-feedback, review-approval, unfinished-downstream], failure_class: none}
  - {capability: themis-simple-plan, selected_path: simple, profile: lightweight, status: escalate-full, next: themis-spec, control_action: set-sticky-full-and-invalidate-quick-downstream, invalidate: [quick-plan, plan-check, review-projection, review-check, review-feedback, review-approval, unfinished-downstream], failure_class: non-counted}
  - {capability: themis-simple-plan, selected_path: simple, profile: lightweight, status: blocked, next: human-unblock, control_action: preserve-continuation-and-request-unblock, invalidate: [], failure_class: non-counted}
  - {capability: themis-spec, selected_path: full, profile: null, status: ready, next: themis-planning, control_action: bind-temporary-specification-handoff, invalidate: [], failure_class: none}
  - {capability: themis-spec, selected_path: full, profile: null, status: needs-questioning, next: themis-q, control_action: return-to-questioning-and-invalidate-downstream, invalidate: [questioning, complexity-assessment, plan, unfinished-downstream], failure_class: non-counted}
  - {capability: themis-spec, selected_path: full, profile: null, status: needs-grounding, next: themis-grounding, control_action: ground-and-resume-specification, invalidate: [], failure_class: non-counted}
  - {capability: themis-spec, selected_path: full, profile: null, status: blocked, next: human-unblock, control_action: preserve-continuation-and-request-unblock, invalidate: [], failure_class: non-counted}
  - {capability: themis-planning, selected_path: full, profile: full, status: ready, next: themis-plan-check, control_action: materialize-unified-plan-pair, invalidate: [plan-check, review-projection, review-check, review-feedback, review-approval, unfinished-downstream], failure_class: none}
  - {capability: themis-planning, selected_path: full, profile: full, status: needs-specification, next: themis-spec, control_action: return-to-specification-and-invalidate-plan, invalidate: [plan, plan-check, review-projection, review-check, review-feedback, review-approval, unfinished-downstream], failure_class: non-counted}
  - {capability: themis-planning, selected_path: full, profile: full, status: needs-grounding, next: themis-grounding, control_action: ground-and-resume-planning, invalidate: [], failure_class: non-counted}
  - {capability: themis-planning, selected_path: full, profile: full, status: blocked, next: human-unblock, control_action: preserve-continuation-and-request-unblock, invalidate: [], failure_class: non-counted}

  # Plan Check
  - {capability: themis-plan-check, selected_path: simple, profile: lightweight, status: pass, next: themis-review-projection, control_action: materialize-plan-check-pass, invalidate: [], failure_class: none}
  - {capability: themis-plan-check, selected_path: simple, profile: lightweight, status: needs-simple-planning, next: themis-simple-plan, control_action: materialize-plan-check-and-return-to-simple-planning, invalidate: [plan, plan-check, review-projection, review-check, review-feedback, review-approval, unfinished-downstream], failure_class: non-counted}
  - {capability: themis-plan-check, selected_path: simple, profile: lightweight, status: escalate-full, next: themis-spec, control_action: materialize-plan-check-and-set-sticky-full, invalidate: [quick-plan, plan-check, review-projection, review-check, review-feedback, review-approval, unfinished-downstream], failure_class: non-counted}
  - {capability: themis-plan-check, selected_path: simple, profile: lightweight, status: blocked, next: human-unblock, control_action: materialize-plan-check-and-request-unblock, invalidate: [], failure_class: non-counted}
