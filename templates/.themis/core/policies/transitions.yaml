# Prompt-level lifecycle policy
# This file is semantic input for the Global Control Rule.
# Current checkout has no evaluator, state recorder, digest service, validator, or transition runtime.

contract: themis-prompt-lifecycle

policy_binding:
  identity: themis-prompt-lifecycle
  lifecycle_must_bind_observed_digest: true
  digest_change_action: stop-and-revalidate

authority:
  target_semantics: current-request-revision
  implementation_facts: [code, configuration, schema, observed-executable-behavior]
  governed_design_constraints: constrain-solutions-only
  specification_handoff: temporary-non-authoritative
  execution_contract: approved-plan

lifecycle:
  stages:
    - questioning
    - complexity-assessment
    - plan-formation
    - plan-check
    - review
    - verify
    - human-acceptance
    - summary
    - completed
  paths:
    simple: [themis-q, themis-complexity-assessment, themis-simple-plan, themis-plan-check]
    full: [themis-q, themis-complexity-assessment, themis-spec, themis-planning, themis-plan-check]
  shared_after_plan_check:
    - themis-review-projection
    - themis-review-check
    - themis-review-dialogue
    - record-review-approval
    - themis-impl
    - themis-verification
    - themis-acceptance-dialogue
    - themis-summary

vocabulary:
  agent_profiles:
    - semantic-readonly
    - independent-checker
    - human-dialogue
    - implementation-writer
  selected_paths: [simple, full, null]
  profiles: [lightweight, full, null]
  route_targets:
    - themis-q
    - themis-grounding
    - themis-complexity-assessment
    - themis-simple-plan
    - themis-spec
    - themis-planning
    - themis-plan-check
    - themis-review-projection
    - themis-review-check
    - themis-review-dialogue
    - themis-impl
    - themis-verification
    - themis-acceptance-dialogue
    - themis-failure-learning
    - themis-summary
    - human-questioning
    - human-review
    - human-unblock
    - requesting-capability
    - resume-main-route
    - failure-control
    - completed
  control_actions:
    - present-questioning-questions
    - persist-questioning-round-and-pointer
    - return-grounding-evidence
    - return-partial-grounding-evidence
    - request-unblock
    - select-simple-path
    - set-sticky-full-path
    - persist-unified-plan
    - use-temporary-specification-handoff
    - return-to-questioning
    - ground-and-resume-specification
    - return-to-specification
    - ground-and-resume-planning
    - record-plan-check-pass
    - return-to-simple-planning
    - return-to-planning
    - ground-and-resume-plan-check
    - persist-review-projection
    - record-review-check-pass
    - regenerate-review-projection
    - continue-human-review
    - record-review-approval
    - ground-and-resume-affected-owner
    - record-implementation-result
    - record-verification-pass
    - bounded-implementation-repair
    - record-human-acceptance
    - enqueue-optional-knowledge-governance
    - record-not-reusable
    - retain-learning-for-later
    - record-learning-unavailable
    - persist-summary-and-complete-lifecycle
    - fail-closed
  invalidation_categories:
    - quick-plan
    - complexity-assessment
    - plan
    - plan-check
    - review-projection
    - review-check
    - review-approval
    - unfinished-downstream
    - affected-verification-evidence
    - human-acceptance
    - summary
  failure_classes: [none, non-counted, counted]
  affected_owner_values:
    - themis-q
    - themis-spec
    - themis-simple-plan
    - themis-planning
    - themis-plan-check
    - themis-review-projection

capability_profiles:
  themis-q: human-dialogue
  themis-grounding: semantic-readonly
  themis-complexity-assessment: semantic-readonly
  themis-simple-plan: semantic-readonly
  themis-spec: semantic-readonly
  themis-planning: semantic-readonly
  themis-plan-check: independent-checker
  themis-review-projection: semantic-readonly
  themis-review-check: independent-checker
  themis-review-dialogue: human-dialogue
  themis-impl: implementation-writer
  themis-verification: independent-checker
  themis-acceptance-dialogue: human-dialogue
  themis-failure-learning: semantic-readonly
  themis-summary: semantic-readonly

guards:
  simple_path:
    assessment_status: simple-qualified
    full_path_required: false
    when_full_path_required_true:
      preserve_capability_status: true
      suppress_route_control_action: select-simple-path
      control_action: set-sticky-full-path
      next: themis-spec
      invalidate: [quick-plan, plan-check, review-projection, review-check, review-approval, unfinished-downstream]
      failure_class: none
  full_path_required:
    sticky_within_lifecycle: true
    clear_on_reassessment: false
  questioning_reentry:
    next_after_converged: themis-complexity-assessment
    preserve_full_path_required: true
  dynamic_continuations:
    requesting_capability:
      require_lifecycle_identity: true
      require_current_continuation_identity: true
    affected_owner:
      require_lifecycle_identity: true
      require_closed_vocabulary: affected_owner_values
    main_route_continuation:
      require_lifecycle_identity: true
      failure_learning_may_replace: false
  counted_failure_order:
    - record-attempt
    - dispatch-non-blocking-failure-learning
    - terminate-on-third-or-continue-route
  persistence:
    completion_requires_observed_recorder_result: true
    unavailable_action: stop-at-current-gate
  policy_currentness:
    require_observed-policy-binding: true
    changed_digest_action: stop-and-revalidate

review_gate:
  before_impl: true
  approval_binds:
    - current-request-revision
    - questioning-round-id
    - questioning-round-digest
    - governed-design-constraint-revisions-and-digests
    - complexity-assessment-digest
    - selected-path
    - full-path-required
    - plan-identity-revision-and-digest
    - plan-check-profile-and-result
    - review-digest
    - review-check-result
    - approver
    - decision
    - approval-time
    - approved-pre-impl-implementation-baseline

verify:
  order: [themis-impl, themis-verification]
  review-markdown-is-execution-input: false
  implementation-and-verification-use-separate-invocations: true
  plan-task-identity-shared: true
  expected-approved-delta-invalidates-approval: false
  unauthorized-external-drift-action: stop-and-revalidate

failure_control:
  maximum_counted_failures: 3
  identity_survives: [agent-restart, model-change, tool-retry, session-resume]
  counted:
    - agent-failure-without-valid-capability-result
    - tool-or-command-failure
    - result-contract-failure
    - declared-execution-failure
    - implementation-defect
  not_counted:
    - full-required
    - escalate-full
    - needs-simple-planning
    - needs-planning
    - needs-specification
    - needs-grounding
    - blocked
    - partial
  after_each_counted_failure: themis-failure-learning
  after_related_later_success: themis-failure-learning
  later_success_requires_explicit_task_link: true
  failure_learning_is_non_blocking: true
  failure_learning_failure_recurses: false
  third_failure:
    - record-attempt-limit-reached
    - forbid-same-task-execution-identity
    - invalidate-unfinished-downstream
    - close-affected-execution-paths

summary_gate:
  requires:
    verification: passed
    human_acceptance: accepted
  knowledge_candidates_block_completion: false

invalidation:
  current-request-revision-change: [questioning-pointer, complexity-assessment, plan, unfinished-downstream]
  questioning-pointer-change: [complexity-assessment, plan, unfinished-downstream]
  governed-design-constraint-change: [complexity-assessment, plan, unfinished-downstream]
  pre-approval-baseline-drift: [assessment-currentness, plan-currentness, unfinished-downstream]
  plan-change: [plan-check, review-projection, review-check, review-approval, unfinished-downstream]
  approval-invalid: [verify]
  implementation-change: [affected-verification-evidence, human-acceptance, summary]
  verification-not-passed: [human-acceptance, summary]

